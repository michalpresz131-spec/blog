<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Allotment and Gardening AllManiac</title>
	<link rel="stylesheet" href="style.css?v=bde9370">
</head>
<body>
	<header class="site-header">
		<div class="container">
			<h1>Allotment and Gardening AllManiac</h1>
			<p class="invitation" aria-label="Escape from the world's rush and join me!">
				<span class="green">E</span><span class="blue">s</span><span class="green">c</span><span class="blue">a</span><span class="green">p</span><span class="blue">e</span>
				<span> </span>
				<span class="green">f</span><span class="blue">r</span><span class="green">o</span><span class="blue">m</span>
				<span> </span>
				<span class="green">t</span><span class="blue">h</span><span class="green">e</span>
				<span> </span>
				<span class="green">w</span><span class="blue">o</span><span class="green">r</span><span class="blue">l</span><span class="green">d</span><span class="blue">'</span><span class="green">s</span>
				<span> </span>
				<span class="green">r</span><span class="blue">u</span><span class="green">s</span><span class="blue">h</span>
				<span> </span>
				<span class="green">a</span><span class="blue">n</span><span class="green">d</span>
				<span> </span>
				<span class="green">j</span><span class="blue">o</span><span class="green">i</span><span class="blue">n</span>
				<span> </span>
				<span class="green">m</span><span class="blue">e</span>
				<span> </span><span class="green">!</span>
			</p>
			<p class="tagline">healthy Cambridgeshire allotments and gardens blog</p>
		</div>
	</header>

	<main class="container">
		<p>Please scroll down to see recent posts :</p>

		<section>
			<h2>Posts</h2>
			<div id="posts" class="posts"></div>
		</section>

		<section class="new-post">
			<h2>Create a Post</h2>
			<form id="postForm">
				<label for="name">Your name:</label>
				<input id="name" name="name" type="text" placeholder="Your name" required />
				<label for="title">Title</label>
				<input id="title" placeholder="Title" required />
				<label for="content">Post content</label>
				<textarea id="content" placeholder="Write your post..." required></textarea>
				<div style="margin:6px 0">
					<label style="display:block;margin-bottom:6px;font-size:14px">Upload Image (optional)</label>
					<input id="imageInput" type="file" accept="image/*" />
					<div id="imagePreview" style="margin-top:8px"></div>
				</div>
				<div class="form-row">
					<button type="submit" id="publishBtn" class="btn">Publish</button>
					<button type="button" id="clearBtn" class="btn alt">Clear</button>
					<button type="button" id="cancelBtn" class="btn alt" style="display:none">Cancel</button>
				</div>
				<div style="margin-top:8px;display:flex;gap:8px;align-items:center">
					<button type="button" id="exportBtn" class="btn alt">Export Posts</button>
					<label class="btn alt" style="display:inline-flex;align-items:center;gap:8px;cursor:pointer">
						Import Posts
						<input id="importInput" type="file" accept="application/json" style="display:none">
					</label>
				</div>
			</form>
		</section>
	</main>

	<footer class="site-footer">
		<div class="container">Built with ❤️ — New posts are reviewed before publishing</div>
	</footer>

	<script src="app.js?v=b2e893e"></script>
</body>
</html>
